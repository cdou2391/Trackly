<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Trackly Hero Illustration</title>
  <desc>Flat teal hero illustration for the Trackly subscription and bills tracker app. Transparent background, designed for dark surfaces.</desc>

  <defs>
    <linearGradient id="cardGrad" x1="186" y1="130" x2="575" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34E1D7"/>
      <stop offset="1" stop-color="#129E98"/>
    </linearGradient>

    <linearGradient id="paperGrad" x1="262" y1="183" x2="522" y2="343" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B6FFFA"/>
      <stop offset="1" stop-color="#69E6DE"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52EEE6"/>
      <stop offset="1" stop-color="#17C7BE"/>
    </linearGradient>

    <filter id="softShadow" x="120" y="70" width="560" height="380" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="18"/>
      <feGaussianBlur stdDeviation="22"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.03 0 0 0 0 0.14 0 0 0 0 0.17 0 0 0 0.25 0"/>
      <feBlend mode="normal" in2="SourceGraphic" result="shape"/>
    </filter>

    <filter id="badgeShadow" x="480" y="90" width="170" height="170" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="10"/>
      <feGaussianBlur stdDeviation="16"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.11 0 0 0 0 0.14 0 0 0 0.22 0"/>
      <feBlend mode="normal" in2="SourceGraphic" result="shape"/>
    </filter>
  </defs>

