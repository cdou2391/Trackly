name: Release APK

# Builds an installable APK and attaches it to a GitHub pre-release.
#
# Push a tag such as `v1.0.0-preview.1` to publish. The release is signed with
# the debug key (see android/app/build.gradle.kts) and built without Sentry or
# Firebase config, so it is for testing, not for the Play Store.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example v1.0.0-preview.2)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: |
          # v1.2.3-preview.1 -> build name 1.2.3; the run number is the build code.
          NAME="$(echo "$TAG" | sed -E 's/^v//; s/[-+].*$//')"
          flutter build apk --release \
            --build-name "$NAME" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Name the APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "trackly-${TAG}-debug-signed.apk"
          sha256sum "trackly-${TAG}-debug-signed.apk" | tee SHA256SUMS.txt

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "trackly-${TAG}-debug-signed.apk" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Trackly ${TAG} (pre-release)" \
            --notes "Test build of Trackly, built from \`${GITHUB_SHA::7}\`.

          - Signed with the **debug key**: for testing only, not for the Play Store.
          - Built without Sentry or Firebase configuration, so no telemetry is sent.
          - Android only. Install by opening the APK and allowing installs from this source.
          - Verify the download against \`SHA256SUMS.txt\`."
