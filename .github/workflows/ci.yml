name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test the release key script
        run: tool/test_restore_release_key.sh

  # Proves the Android release build works from a clean checkout, and that the
  # release signing config does what it should. The real release key is not
  # available here (and must not be), so this builds twice:
  #   1. with no key: falls back to the debug key, as a fresh clone does;
  #   2. with a throwaway key made on the spot: must be signed by that key.
  # Real releases come from the Release APK workflow.
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK without a signing key
        run: flutter build apk --release

      - name: Check it fell back to the debug key
        run: |
          tool/apk_cert.sh build/app/outputs/flutter-apk/app-release.apk > cert.txt
          cat cert.txt
          grep -q "CN=Android Debug" cert.txt

      - name: Refuse the fallback when a key is required
        run: |
          if REQUIRE_RELEASE_SIGNING=true flutter build apk --release; then
            echo "::error::The build should fail when a key is required but missing."
            exit 1
          fi

      - name: Build APK with a throwaway release key
        env:
          ANDROID_KEYSTORE_PASSWORD: throwaway-ci-password
          ANDROID_KEY_ALIAS: ci
          ANDROID_KEY_PASSWORD: throwaway-ci-password
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Trackly CI Throwaway"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/ci.jks"
          REQUIRE_RELEASE_SIGNING=true flutter build apk --release

      - name: Check it is signed by the throwaway key
        run: |
          tool/apk_cert.sh build/app/outputs/flutter-apk/app-release.apk > cert.txt
          cat cert.txt
          grep -q "CN=Trackly CI Throwaway" cert.txt

      - uses: actions/upload-artifact@v4
        with:
          name: trackly-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
